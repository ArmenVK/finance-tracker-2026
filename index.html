<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мой финансовый трекер</title>
<style>
  :root {
    color-scheme: dark;
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    padding: 48px 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #121212;
    color: #e8e8e8;
  }
  h1 {
    margin: 0 0 24px;
    font-size: 1.5rem;
    font-weight: 600;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: #1e1e1e;
    border: 1px solid #333;
    border-radius: 8px;
    overflow: hidden;
  }
  th, td {
    padding: 12px 16px;
    text-align: left;
    font-size: 0.95rem;
  }
  th {
    background: #2a2a2a;
    font-weight: 600;
    border-bottom: 1px solid #333;
  }
  td {
    border-bottom: 1px solid #2a2a2a;
  }
  tr:last-child td {
    border-bottom: none;
  }
  td:nth-child(3) {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  td:last-child {
    width: 1%;
    text-align: center;
    padding: 8px;
  }
  tfoot td {
    font-weight: 700;
    background: #262626;
    border-top: 2px solid #3a3a3a;
  }
  .delete-btn {
    background: transparent;
    border: 1px solid #4a2a2a;
    border-radius: 6px;
    color: #d98a8a;
    width: 28px;
    height: 28px;
    line-height: 1;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .delete-btn:hover {
    background: #3a1f1f;
    border-color: #7a3a3a;
  }
  form {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: flex-end;
    margin: 0 0 24px;
    padding: 16px;
    background: #1e1e1e;
    border: 1px solid #333;
    border-radius: 8px;
  }
  form .field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  form label {
    font-size: 0.8rem;
    color: #aaa;
  }
  form input,
  form select {
    background: #121212;
    border: 1px solid #3a3a3a;
    border-radius: 6px;
    color: #e8e8e8;
    padding: 8px 10px;
    font-size: 0.95rem;
    font-family: inherit;
  }
  form button {
    background: #2a6f4d;
    border: 1px solid #3a8f63;
    border-radius: 6px;
    color: #e8e8e8;
    padding: 9px 18px;
    font-size: 0.95rem;
    font-family: inherit;
    cursor: pointer;
  }
  form button:hover {
    background: #35855c;
  }
</style>
</head>
<body>
  <h1>Мой финансовый трекер</h1>
  <form id="add-entry-form">
    <div class="field">
      <label for="entry-date">Дата</label>
      <input type="date" id="entry-date" required>
    </div>
    <div class="field">
      <label for="entry-category">Категория</label>
      <input type="text" id="entry-category" list="category-list" required>
      <datalist id="category-list"></datalist>
    </div>
    <div class="field">
      <label for="entry-type">Тип</label>
      <select id="entry-type">
        <option value="expense">Расход</option>
        <option value="income">Доход</option>
      </select>
    </div>
    <div class="field">
      <label for="entry-amount">Сумма</label>
      <input type="number" id="entry-amount" min="0" step="any" required>
    </div>
    <button type="submit">Добавить запись</button>
  </form>
  <table>
    <thead>
      <tr>
        <th>Дата</th>
        <th>Категория</th>
        <th>Сумма</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
    </tbody>
    <tfoot>
      <tr>
        <td colspan="2">Итого</td>
        <td>0 ₽</td>
        <td></td>
      </tr>
    </tfoot>
  </table>
  <script>
    const STORAGE_KEY = 'finance2026.entries';
    const tbody = document.querySelector('table tbody');
    const tfootCell = document.querySelector('table tfoot td:nth-child(2)');
    const categoryList = document.getElementById('category-list');
    const form = document.getElementById('add-entry-form');

    function parseRuDate(text) {
      const [day, month, year] = text.split('.').map(Number);
      return new Date(year, month - 1, day);
    }

    function parseAmount(text) {
      const cleaned = text.replace(/\s/g, '').replace('₽', '').replace('−', '-');
      return parseFloat(cleaned);
    }

    function formatAmount(value) {
      if (value === 0) return '0 ₽';
      const sign = value < 0 ? '-' : '+';
      const formatted = Math.abs(value).toLocaleString('ru-RU');
      return `${sign}${formatted} ₽`;
    }

    function makeId() {
      return (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`);
    }

    function refreshCategoryList() {
      const categories = new Set(
        Array.from(tbody.querySelectorAll('tr')).map(tr => tr.children[1].textContent.trim())
      );
      categoryList.innerHTML = '';
      categories.forEach(category => {
        const option = document.createElement('option');
        option.value = category;
        categoryList.appendChild(option);
      });
    }

    function recalcTotal() {
      const total = Array.from(tbody.querySelectorAll('tr'))
        .reduce((sum, tr) => sum + parseAmount(tr.children[2].textContent), 0);
      tfootCell.textContent = formatAmount(total);
    }

    function insertRowSorted(dateText, category, amountText, id) {
      const row = document.createElement('tr');
      row.dataset.id = id;
      row.innerHTML = `<td>${dateText}</td><td>${category}</td><td>${amountText}</td><td><button type="button" class="delete-btn" title="Удалить запись">✕</button></td>`;
      const newDate = parseRuDate(dateText);
      const existingRows = Array.from(tbody.querySelectorAll('tr'));
      const nextRow = existingRows.find(tr => parseRuDate(tr.children[0].textContent) > newDate);
      if (nextRow) {
        tbody.insertBefore(row, nextRow);
      } else {
        tbody.appendChild(row);
      }
    }

    function loadSavedEntries() {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      let migrated = false;
      saved.forEach(entry => {
        if (!entry.id) {
          entry.id = makeId();
          migrated = true;
        }
      });
      if (migrated) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
      }
      saved.forEach(entry => insertRowSorted(entry.date, entry.category, entry.amountText, entry.id));
    }

    function saveEntry(entry) {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      saved.push(entry);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
    }

    function deleteEntry(id) {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      const filtered = saved.filter(entry => entry.id !== id);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(filtered));
    }

    tbody.addEventListener('click', event => {
      const button = event.target.closest('.delete-btn');
      if (!button) return;
      const row = button.closest('tr');
      if (!confirm('Удалить запись?')) return;
      deleteEntry(row.dataset.id);
      row.remove();
      refreshCategoryList();
      recalcTotal();
    });

    loadSavedEntries();
    refreshCategoryList();
    recalcTotal();

    form.addEventListener('submit', event => {
      event.preventDefault();

      const dateInput = document.getElementById('entry-date');
      const categoryInput = document.getElementById('entry-category');
      const typeInput = document.getElementById('entry-type');
      const amountInput = document.getElementById('entry-amount');

      const [year, month, day] = dateInput.value.split('-');
      const dateText = `${day}.${month}.${year}`;
      const category = categoryInput.value.trim();
      const amountValue = parseFloat(amountInput.value) * (typeInput.value === 'expense' ? -1 : 1);
      const amountText = formatAmount(amountValue);
      const id = makeId();

      insertRowSorted(dateText, category, amountText, id);
      saveEntry({ id, date: dateText, category, amountText });
      refreshCategoryList();
      recalcTotal();
      form.reset();
    });
  </script>
</body>
</html>
